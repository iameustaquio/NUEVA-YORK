<style>
  :root{
    --navy:#1c3a4a; --terracotta:#c96a3f; --cream:#f7f3ea; --ink:#26241f; --paper:#fffdf8; --line:#e7ddc9;
    --card-bg:rgba(255,253,248,.96); --card-bg-solid:#fffdf8; --card-ink:#26241f; --card-sub:#7a7466;
    --dark-navy:rgba(28,58,74,.94);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --card-bg:rgba(30,32,30,.92); --card-bg-solid:#201f1c; --card-ink:#f1ece0; --card-sub:#a9a190;
      --line:#3a382f; --cream:#232220; --dark-navy:rgba(18,30,38,.94);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:'Segoe UI',Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden;background:var(--cream);}
  #map{position:absolute;inset:0;background:#eef0e6;}
  .maplibregl-ctrl-attrib{font-size:9px;}

  #tabs{
    position:absolute; top:10px; left:10px; right:10px; z-index:1000;
    display:flex; gap:4px; background:var(--card-bg); border-radius:10px;
    padding:6px; box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  #tabs-scroll{ display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; flex:1; min-width:0; }
  .tab{ border:none; background:transparent; padding:7px 11px; font-size:12.5px; font-weight:700;
    color:#6b6455; border-radius:8px; cursor:pointer; white-space:nowrap; flex:none; }
  .tab.active{ background:var(--navy); color:#fff; }
  #searchbtn{ flex:none; border:none; background:transparent; padding:7px 10px; font-size:14px; cursor:pointer; border-radius:8px; color:var(--navy); }
  #searchbtn.active{ background:var(--navy); color:#fff; }

  #searchpanel{
    position:absolute; top:58px; left:10px; right:10px; z-index:1100; display:none;
    background:var(--card-bg-solid); color:var(--card-ink); border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.25);
    padding:8px; max-height:60vh; flex-direction:column;
  }
  #searchinput{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;
    background:var(--card-bg-solid); color:var(--card-ink); outline:none;
  }
  #searchresults{ overflow-y:auto; margin-top:6px; }
  .sres{ display:flex; align-items:center; gap:8px; padding:7px 4px; cursor:pointer; border-bottom:1px solid var(--line); }
  .sres:last-child{ border-bottom:none; }
  .sres-day{ flex:none; color:#fff; font-size:9.5px; font-weight:700; padding:2px 5px; border-radius:5px; }
  .sres-name{ flex:1; font-size:12.5px; }
  .sres-time{ flex:none; font-size:10.5px; color:var(--terracotta); font-weight:700; }
  .sres-empty{ padding:8px 4px; font-size:12px; color:var(--card-sub); }

  #daycard{
    position:absolute; top:58px; left:10px; z-index:900; max-width:300px;
    background:var(--dark-navy); color:#fff; border-radius:10px; padding:9px 12px;
    box-shadow:0 2px 10px rgba(0,0,0,.2); font-size:12px; line-height:1.4; display:none;
    animation:cardIn .25s ease both;
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  #daycard b{font-family:Georgia,serif; font-size:14px; display:block; margin-bottom:2px;}
  #daycard .goal{opacity:.85; font-style:italic;}
  #daycard .close{position:absolute; top:4px; right:8px; cursor:pointer; opacity:.7; font-size:13px;}
  #playbtn{ position:absolute; top:2px; right:26px; background:transparent; border:none; color:#fff; font-size:13px; cursor:pointer; padding:2px 4px; opacity:.9; }
  #playbtn.active{ opacity:1; }
  #weatherchip{ margin-top:5px; font-size:11px; opacity:.9; display:none; }

  #legend{
    position:absolute; top:58px; left:10px; z-index:900; background:var(--card-bg); color:var(--card-ink);
    border-radius:10px; padding:10px 12px; box-shadow:0 2px 10px rgba(0,0,0,.15); font-size:12px; max-width:230px;
  }
  #legend .item{display:flex; align-items:center; gap:7px; margin-bottom:5px; cursor:pointer;}
  #legend input{margin:0;}
  #legend .swatch{width:11px;height:11px;border-radius:50%;flex:none;}
  #legend .title{font-weight:700; color:var(--navy); margin-bottom:6px; font-size:12.5px;}

  #tlegend{
    position:absolute; bottom:14px; left:10px; z-index:900; background:var(--card-bg); color:var(--card-ink);
    border-radius:10px; padding:7px 10px; box-shadow:0 2px 10px rgba(0,0,0,.15); font-size:11px; display:none;
  }
  #tlegend span{margin-right:10px;}

  #reopen{
    position:absolute; top:58px; right:10px; z-index:900; background:var(--card-bg); color:var(--navy);
    border:none; border-radius:8px; padding:6px 10px; font-size:11.5px; font-weight:700;
    box-shadow:0 2px 8px rgba(0,0,0,.15); cursor:pointer; display:none;
  }

  #routestatus{
    position:absolute; bottom:60px; left:50%; transform:translateX(-50%); z-index:950;
    background:var(--dark-navy); color:#fff; padding:6px 12px; border-radius:20px;
    font-size:11.5px; font-weight:600; box-shadow:0 2px 10px rgba(0,0,0,.2); display:none;
    align-items:center; gap:6px; white-space:nowrap; pointer-events:none;
  }
  #routestatus .spin{ display:inline-block; animation:spin 1s linear infinite; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  #toast{
    position:absolute; left:50%; bottom:60px; transform:translateX(-50%); z-index:1300;
    background:var(--dark-navy); color:#fff; padding:8px 14px; border-radius:20px;
    font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.25); display:none; max-width:82%; text-align:center;
  }

  /* Tarjeta emergente anclada al punto exacto del mapa (Popup nativo de
     MapLibre), no un panel fijo en pantalla, para que quede claro a qué
     lugar corresponde cada tarjeta. */
  .stop-popup .maplibregl-popup-content{
    background:var(--card-bg-solid); color:var(--card-ink); border-radius:12px; padding:12px 14px;
    box-shadow:0 4px 20px rgba(0,0,0,.3); font-size:12.5px; line-height:1.45; max-width:260px;
    animation:popIn .18s cubic-bezier(.34,1.4,.64,1) both;
  }
  .stop-popup .maplibregl-popup-tip{ border-top-color:var(--card-bg-solid); }
  .stop-popup.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{ border-bottom-color:var(--card-bg-solid); }
  .stop-popup .maplibregl-popup-close-button{ font-size:17px; color:#999; padding:2px 7px; }
  @keyframes popIn{ from{opacity:0; transform:translateY(6px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  .stop-popup b{color:var(--navy); font-size:13.5px;}
  .stop-popup .badge{display:inline-block; font-size:9px; font-weight:700; text-transform:uppercase; padding:1px 6px; border-radius:8px; margin-right:4px; margin-bottom:4px;}
  .badge-new{background:#dff0e2; color:#2b7a3d;}
  .badge-food{background:#fde8d8; color:#b5502a;}
  .badge-warn{background:#fbe3e0; color:#a4341f;}
  .stop-popup .links{margin-top:6px; display:flex; flex-direction:column; gap:6px;}
  .stop-popup a{display:inline-block; color:var(--navy); font-weight:700; font-size:12px;}

  #timeline{
    position:absolute; left:0; right:0; bottom:0; z-index:800; display:none;
    gap:8px; overflow-x:auto; padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, rgba(0,0,0,.18), transparent);
    -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity;
  }
  .tchip{
    --c:#999; flex:none; scroll-snap-align:center; cursor:pointer; border:none; text-align:left;
    background:var(--card-bg-solid); color:var(--card-ink); border-radius:10px; padding:6px 10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2); border-bottom:3px solid var(--c); min-width:108px; max-width:150px;
  }
  .tchip.active{ box-shadow:0 2px 12px rgba(0,0,0,.35); transform:translateY(-2px); }
  .tchip .tnum{ display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%;
    background:var(--c); color:#fff; font-size:9.5px; font-weight:700; margin-right:4px; }
  .tchip .ttime{ font-size:10px; font-weight:700; color:var(--terracotta); }
  .tchip .tname{ display:block; font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

  #zoomwrap .maplibregl-ctrl-group{ box-shadow:0 2px 8px rgba(0,0,0,.2); }

  .userloc-marker{ pointer-events:none; }
</style>

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function circlePolygon(lat, lng, radiusMeters, points){
  points = points || 64;
  const coords = [];
  const latRad = lat*Math.PI/180;
  const metersPerDegLat = 111320;
  const metersPerDegLng = 111320*Math.cos(latRad);
  for(let i=0;i<=points;i++){
    const theta = (i/points)*2*Math.PI;
    coords.push([lng + radiusMeters*Math.cos(theta)/metersPerDegLng, lat + radiusMeters*Math.sin(theta)/metersPerDegLat]);
  }
  return [coords];
}
function isWalkingTr(tr){ if(!tr) return true; return tr.trim().startsWith('🚶'); }
function findWalkingChains(stops){
  const chains = [];
  let current = [0];
  for(let i=1;i<stops.length;i++){
    if(isWalkingTr(stops[i].tr)) current.push(i);
    else { if(current.length>1) chains.push(current.slice()); current=[i]; }
  }
  if(current.length>1) chains.push(current.slice());
  return chains;
}
function chainKey(latlngs){ return latlngs.map(function(p){ return p.lat.toFixed(5)+','+p.lng.toFixed(5); }).join('|'); }
function fetchWalkingGeometry(latlngs){
  const coordStr = latlngs.map(function(p){ return p.lng+','+p.lat; }).join(';');
  const url = 'https://router.project-osrm.org/route/v1/foot/'+coordStr+'?overview=full&geometries=geojson';
  return fetch(url).then(function(res){
    if(!res.ok) throw new Error('OSRM '+res.status);
    return res.json();
  }).then(function(data){
    if(!data.routes || !data.routes[0]) throw new Error('sin ruta');
    return data.routes[0].geometry.coordinates;
  });
}

/* Edificios en 3D: se apoya en el esquema OpenMapTiles (capa "building")
   que trae el estilo vectorial. Si el estilo de respaldo (sin red) está
   activo, o el esquema no coincide, se omite sin romper nada. */
function addBuildings3D(){
  if(map.getLayer('buildings-3d')) return;
  try{
    const sources = map.getStyle().sources;
    const vectorSourceId = Object.keys(sources).find(function(id){ return sources[id].type==='vector'; });
    if(!vectorSourceId) return;
    map.addLayer({
      id:'buildings-3d', type:'fill-extrusion', source:vectorSourceId, 'source-layer':'building',
      minzoom:14,
      paint:{
        'fill-extrusion-color':'#d9cdb6',
        'fill-extrusion-height':['coalesce',['get','render_height'],['*',['coalesce',['get','levels'],4],3]],
        'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
        'fill-extrusion-opacity':0.75
      }
    });
  }catch(err){ /* el estilo de respaldo no tiene capa de edificios: sin problema */ }
}

function ensureLayers(){
  if(layersReady) return;
  layersReady = true;

  if(!map.getSource('zones')){
    map.addSource('zones', {type:'geojson', data:{type:'FeatureCollection', features: ZONES.map(function(z){
      return {type:'Feature', properties:{name:z.name}, geometry:{type:'Polygon', coordinates:circlePolygon(z.lat,z.lng,z.r)}};
    })}});
    map.addLayer({id:'zones-fill', type:'fill', source:'zones', paint:{'fill-color':'#1c3a4a','fill-opacity':0.06}});
    map.addLayer({id:'zones-line', type:'line', source:'zones', paint:{'line-color':'#1c3a4a','line-width':1,'line-dasharray':[3,3]}});
    map.addLayer({id:'zones-labels', type:'symbol', source:'zones', layout:{'text-field':['get','name'],'text-size':11,'text-font':['Noto Sans Bold']},
      paint:{'text-color':'#1c3a4a','text-halo-color':'#fffdf8','text-halo-width':1.6}});
  }

  DAYS.forEach(function(day){
    const fallbackId = 'day'+day.id+'-fallback';
    const realId = 'day'+day.id+'-real';
    if(!map.getSource(fallbackId)){
      map.addSource(fallbackId, {type:'geojson', data:{type:'Feature', geometry:{type:'LineString',
        coordinates: day.stops.map(function(s){ return [s.lng,s.lat]; })}}});
      map.addLayer({id:fallbackId, type:'line', source:fallbackId,
        paint:{'line-color':DAY_COLORS[day.id], 'line-width':3, 'line-opacity':.8, 'line-dasharray':[1,2.6]}});
    }
    if(!map.getSource(realId)){
      map.addSource(realId, {type:'geojson', data:{type:'FeatureCollection', features:[]}});
      map.addLayer({id:realId, type:'line', source:realId,
        paint:{'line-color':DAY_COLORS[day.id], 'line-width':4, 'line-opacity':0, 'line-opacity-transition':{duration:700}}});
    }
  });

  addBuildings3D();
  createMarkers();
  if(!hotelMarker){
    const el = document.createElement('div');
    el.className = 'ml-hotel-marker';
    Object.assign(el.style, {width:'32px',height:'32px',borderRadius:'50%',background:'#c96a3f',border:'2.5px solid #fff',
      boxShadow:'0 2px 6px rgba(0,0,0,.35)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'15px', cursor:'pointer'});
    el.textContent = '🏨';
    el.addEventListener('click', function(){ showPopup({n:HOTEL.name, t:null, lat:HOTEL.lat, lng:HOTEL.lng, link:gmaps(HOTEL.name)}, null); });
    hotelMarker = new Marker({element:el}).setLngLat([HOTEL.lng, HOTEL.lat]).addTo(map);
  }

  applyCurrentView();
}

const CAT_ICONS = {food:'🍽️', bar:'🍸', shop:'🛍️', sight:'🏛️', park:'🌳', transit:'🚇'};
/* IMPORTANTE: MapLibre controla el `transform` del elemento raíz del
   Marker para posicionarlo en el mapa (lo actualiza en cada frame). Si
   esa MISMA propiedad se anima por CSS en ese elemento, la animación
   "gana" y dejamos el marcador clavado en un transform equivocado —
   visible pero en el sitio incorrecto. Por eso la animación de entrada
   y cualquier `position:relative` para los hijos (insignia, anillo) van
   en un <div> interno separado, nunca en el elemento raíz del Marker. */
function markerEl(color, number, big, cat, warn){
  const el = document.createElement('div');
  el.className = 'stop-marker';
  const size = big ? 32 : 22;
  const inner = document.createElement('div');
  Object.assign(inner.style, {
    width:size+'px', height:size+'px', borderRadius:'50%', background:color, border:'2px solid #fff',
    boxShadow:'0 1px 5px rgba(0,0,0,.35)', display:'flex', alignItems:'center', justifyContent:'center',
    color:'#fff', fontWeight:'700', fontSize:(big?'14px':'11px'), cursor:'pointer', position:'relative',
    animation:'markerPop .35s cubic-bezier(.34,1.5,.64,1) both'
  });
  inner.style.animationDelay = (Math.min(number-1,8)*40)+'ms';
  const icon = warn ? '⚠️' : CAT_ICONS[cat];
  inner.textContent = icon || number;
  if(icon && big){
    const badge = document.createElement('span');
    Object.assign(badge.style, {position:'absolute', bottom:'-7px', right:'-7px', minWidth:'18px', height:'18px', padding:'0 3px',
      borderRadius:'9px', background:'#fff', border:'1.5px solid '+color, color:'#26241f', fontSize:'10.5px', fontWeight:'800',
      display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 1px 3px rgba(0,0,0,.35)'});
    badge.textContent = number;
    inner.appendChild(badge);
  }
  if(warn){
    const ring = document.createElement('span');
    Object.assign(ring.style, {position:'absolute', inset:'-6px', borderRadius:'50%',
      border:'2px solid #c43c28', animation:'warnPulse 1.6s ease-in-out infinite'});
    inner.appendChild(ring);
  }
  el.appendChild(inner);
  return el;
}
const styleSheet = document.createElement('style');
styleSheet.textContent = '@keyframes markerPop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}'+
  '@keyframes warnPulse{0%{transform:scale(.85);opacity:.9;}70%{transform:scale(1.25);opacity:0;}100%{opacity:0;}}';
document.head.appendChild(styleSheet);

function createMarkers(){
  DAYS.forEach(function(day){
    /* Los iconos de transporte se crean ANTES que las paradas para que,
       si se solapan en pantalla, la parada (más importante e con su
       número de orden) quede siempre encima y reciba el toque. */
    transportMarkers[day.id] = [];
    for(let i=0;i<day.stops.length-1;i++){
      const trText = day.stops[i+1].tr;
      if(!trText) continue;
      const a = day.stops[i], b = day.stops[i+1];
      const mid = [(a.lng+b.lng)/2, (a.lat+b.lat)/2];
      const el = document.createElement('div');
      Object.assign(el.style, {width:'22px',height:'22px',borderRadius:'50%',background:'var(--card-bg-solid,#fffdf8)',
        border:'1px solid #e7ddc9', display:'flex', alignItems:'center', justifyContent:'center', fontSize:'11px', cursor:'pointer',
        boxShadow:'0 1px 4px rgba(0,0,0,.2)'});
      el.textContent = trText.split(' ')[0];
      el.addEventListener('click', function(){ showPopup({n:'Transporte', t:null, note:trText, lat:mid[1], lng:mid[0]}, 'Día '+day.id+' · '+day.label); });
      const marker = new Marker({element:el}).setLngLat(mid).addTo(map);
      transportMarkers[day.id].push(marker);
    }
    dayMarkers[day.id] = day.stops.map(function(stop, i){
      const color = stop.isHotel ? '#c96a3f' : DAY_COLORS[day.id];
      const el = markerEl(color, i+1, true, stop.cat, stop.warn);
      el.addEventListener('click', function(){
        showPopup(stop, currentView.type==='general' ? ('Día '+day.id+' · '+day.label) : null);
        highlightChip(i);
      });
      const marker = new Marker({element:el}).setLngLat([stop.lng, stop.lat]).addTo(map);
      return {marker:marker, stop:stop, index:i};
    });
  });
}

/* ---------------------------------------------------------
   RUTAS REALES A PIE (OSRM) — caché en memoria (nunca
   localStorage/sessionStorage), reutilizada entre pestañas.
--------------------------------------------------------- */
function appendRealSegment(day, coords){
  if(!realSegmentsByDay[day.id]) realSegmentsByDay[day.id] = [];
  realSegmentsByDay[day.id].push(coords);
  const src = map.getSource('day'+day.id+'-real');
  if(!src) return;
  src.setData({type:'FeatureCollection', features: realSegmentsByDay[day.id].map(function(c){
    return {type:'Feature', geometry:{type:'LineString', coordinates:c}};
  })});
  if(map.getLayer('day'+day.id+'-real')) map.setPaintProperty('day'+day.id+'-real', 'line-opacity', 0.9);
}
function enhanceWalkingRoutesFor(day){
  const chains = findWalkingChains(day.stops);
  chains.forEach(function(chainIdx){
    const latlngs = chainIdx.map(function(i){ return {lat:day.stops[i].lat, lng:day.stops[i].lng}; });
    const key = chainKey(latlngs);
    if(routeCache.has(key)){
      const cached = routeCache.get(key);
      if(cached!=='FAILED') appendRealSegment(day, cached);
      return;
    }
    pendingRouteRequests++; updateRouteStatusUI();
    fetchWalkingGeometry(latlngs).then(function(coords){
      routeCache.set(key, coords);
      appendRealSegment(day, coords);
    }).catch(function(){
      routeCache.set(key, 'FAILED');
      noteRouteFailure();
    }).then(function(){
      pendingRouteRequests--; updateRouteStatusUI();
    });
  });
}

function popupHtml(stop,dayLabel){
  let badges='';
  if(stop.warn) badges+='<span class="badge badge-warn">⚠️ Revisar horario</span>';
  if(stop.isNew) badges+='<span class="badge badge-new">Nuevo</span>';
  if(stop.cat==='food') badges+='<span class="badge badge-food">Comida</span>';
  let html=(badges?'<div>'+badges+'</div>':'')+'<b>'+stop.n+'</b>';
  if(stop.t) html+=' <span style="color:#c96a3f;font-weight:700;">· '+stop.t+'</span>';
  if(dayLabel) html+='<div style="font-size:10.5px;color:var(--card-sub);margin-top:1px;">'+dayLabel+'</div>';
  if(stop.note) html+='<div style="margin-top:5px;">'+stop.note+'</div>';
  if(stop.hours) html+='<div style="margin-top:4px;font-size:11px;"><b style="color:var(--navy);">🕐</b> '+stop.hours+'</div>';
  let links = '';
  if(stop.link) links += '<a href="'+stop.link+'" target="_blank" rel="noopener">📍 Ver en Google Maps</a>';
  if(stop.lat!=null && stop.lng!=null) links += '<a href="'+gDirectionsUrl(stop.lat,stop.lng)+'" target="_blank" rel="noopener">🧭 Cómo llegar a pie</a>';
  if(links) html += '<div class="links">'+links+'</div>';
  return html;
}
let activePopup = null;
function showPopup(stop,dayLabel){
  if(stop.lat==null || stop.lng==null) return;
  if(activePopup) activePopup.remove();
  activePopup = new Popup({className:'stop-popup', closeButton:true, closeOnClick:false, maxWidth:'280px', offset:16})
    .setLngLat([stop.lng, stop.lat])
    .setHTML(popupHtml(stop,dayLabel))
    .addTo(map);
  activePopup.on('close', function(){
    activePopup = null;
    if(currentView.type==='day') setTimelineVisible(true);
  });
  setTimelineVisible(false);
}
function closePopup(){
  if(activePopup) activePopup.remove();
}

function highlightChip(i){
  const chips = document.querySelectorAll('#timeline .tchip');
  chips.forEach(function(c,idx){ c.classList.toggle('active', idx===i); });
  if(chips[i]) chips[i].scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}
function focusStop(day, index, dayLabel){
  const s = day.stops[index];
  map.flyTo({center:[s.lng, s.lat], zoom:Math.max(map.getZoom(), 15.5), duration:700});
  showPopup(s, dayLabel);
  highlightChip(index);
}

/* ---------------------------------------------------------
   CLIMA (Open-Meteo, sin clave de API)
--------------------------------------------------------- */
const TRIP_START = '2026-08-07';
function tripDateForDay(id){
  const d = new Date(TRIP_START+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+(id-1));
  return d.toISOString().slice(0,10);
}
const WMO_EMOJI = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',
  61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const weatherCache = new Map();
function renderWeatherChip(w){
  const el = document.getElementById('weatherchip');
  if(!w){ el.style.display='none'; return; }
  const emoji = WMO_EMOJI[w.code] || '🌡️';
  el.textContent = emoji+' '+Math.round(w.tmax)+'°/'+Math.round(w.tmin)+'° · '+w.precip+'% lluvia';
  el.style.display='block';
}
function fetchWeatherFor(day){
  const dateStr = tripDateForDay(day.id);
  if(weatherCache.has(dateStr)){ renderWeatherChip(weatherCache.get(dateStr)); return; }
  renderWeatherChip(null);
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.75&longitude=-74.0&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FNew_York&start_date='+dateStr+'&end_date='+dateStr;
  fetch(url).then(function(res){ if(!res.ok) throw new Error('weather'); return res.json(); })
    .then(function(data){
      if(!data.daily || !data.daily.time || !data.daily.time.length) throw new Error('sin datos aún');
      const w = {tmax:data.daily.temperature_2m_max[0], tmin:data.daily.temperature_2m_min[0],
        code:data.daily.weathercode[0], precip:data.daily.precipitation_probability_max[0]};
      weatherCache.set(dateStr, w);
      renderWeatherChip(w);
    }).catch(function(){ /* fuera de rango de previsión o sin red: se omite en silencio, es un extra */ });
}

/* ---------------------------------------------------------
   VISTAS: día / general
--------------------------------------------------------- */
let currentView = {type:'general'};
const dayToggleState = {};
DAYS.forEach(function(d){ dayToggleState[d.id]=true; });

function applyCurrentView(){
  if(!layersReady) return;
  if(currentView.type==='day'){
    DAYS.forEach(function(d){ setDayVisible(d.id, d.id===currentView.day.id); });
    setZonesVisible(false);
    setHotelMarkerVisible(false);
  } else {
    DAYS.forEach(function(d){ setDayVisible(d.id, dayToggleState[d.id]); });
    setZonesVisible(true);
    setHotelMarkerVisible(true);
  }
}

function showDay(day){
  stopPlayback();
  currentView = {type:'day', day:day};
  document.getElementById('legend').style.display='none';
  document.getElementById('tlegend').style.display='block';
  closePopup();
  applyCurrentView();
  const bounds = new LngLatBounds();
  day.stops.forEach(function(s){ bounds.extend([s.lng, s.lat]); });
  map.fitBounds(bounds, {padding:{top:130, bottom:170, left:50, right:50}, duration: hasRenderedOnce?650:0, maxZoom:18, pitch:50, bearing:-12});
  document.getElementById('dc-title').textContent = 'Día '+day.id+' · '+day.label+' — '+day.title;
  document.getElementById('dc-goal').textContent = day.goal;
  document.getElementById('daycard').style.display='block';
  document.getElementById('reopen').style.display='none';
  buildTimeline(day);
  fetchWeatherFor(day);
  if(layersReady) enhanceWalkingRoutesFor(day);
  hasRenderedOnce = true;
}
function showGeneral(){
  stopPlayback();
  currentView = {type:'general'};
  document.getElementById('daycard').style.display='none';
  document.getElementById('reopen').style.display='none';
  document.getElementById('tlegend').style.display='none';
  closePopup();
  hideTimeline();
  applyCurrentView();
  const bounds = new LngLatBounds();
  bounds.extend([HOTEL.lng, HOTEL.lat]);
  DAYS.forEach(function(d){ d.stops.forEach(function(s){ bounds.extend([s.lng,s.lat]); }); });
  ZONES.forEach(function(z){ bounds.extend([z.lng,z.lat]); });
  map.fitBounds(bounds, {padding:40, duration: hasRenderedOnce?650:0, pitch:0, bearing:0});
  if(layersReady) DAYS.forEach(function(d){ enhanceWalkingRoutesFor(d); });

  let html = '<div class="title">Días del viaje</div>';
  DAYS.forEach(function(d){
    html += '<label class="item"><input type="checkbox" '+(dayToggleState[d.id]?'checked':'')+' onchange="toggleDay('+d.id+',this.checked)"><span class="swatch" style="background:'+DAY_COLORS[d.id]+'"></span>Día '+d.id+' · '+d.label+'</label>';
  });
  document.getElementById('legend').innerHTML = html;
  document.getElementById('legend').style.display='block';
  hasRenderedOnce = true;
}
function toggleDay(id, visible){
  dayToggleState[id] = visible;
  if(currentView.type==='general') setDayVisible(id, visible);
}
window.toggleDay = toggleDay;

function closeDayCard(){
  document.getElementById('daycard').style.display='none';
  document.getElementById('reopen').style.display='block';
}
function reopenCard(){
  document.getElementById('daycard').style.display='block';
  document.getElementById('reopen').style.display='none';
}
window.reopenCard = reopenCard;
window.closeDayCard = closeDayCard;

/* ---------------------------------------------------------
   MODO "REPRODUCIR DÍA"
--------------------------------------------------------- */
let playState = null;
function stopPlayback(){
  if(playState && playState.timer) clearTimeout(playState.timer);
  playState = null;
  const btn = document.getElementById('playbtn');
  if(btn){ btn.textContent='▶️'; btn.classList.remove('active'); }
}
function playStep(day, idx){
  if(!playState || playState.dayId!==day.id) return;
  if(idx >= day.stops.length){ stopPlayback(); return; }
  playState.index = idx;
  focusStop(day, idx, null);
  playState.timer = setTimeout(function(){ playStep(day, idx+1); }, 2700);
}
function togglePlay(){
  if(currentView.type!=='day') return;
  const day = currentView.day;
  if(playState && playState.dayId===day.id){ stopPlayback(); return; }
  stopPlayback();
  playState = {dayId:day.id, index:0, timer:null};
  const btn = document.getElementById('playbtn');
  if(btn){ btn.textContent='⏸️'; btn.classList.add('active'); }
  playStep(day, 0);
}
window.togglePlay = togglePlay;

/* ---------------------------------------------------------
   PESTAÑAS
--------------------------------------------------------- */
let tabHtml = '<div id="tabs-scroll"><button class="tab active" id="tab-general" onclick="selectTab(\'general\')">🗺️ General</button>';
DAYS.forEach(function(d){ tabHtml += '<button class="tab" id="tab-'+d.id+'" onclick="selectTab('+d.id+')">'+d.label+'</button>'; });
tabHtml += '</div><button id="searchbtn" onclick="toggleSearch()" title="Buscar una parada">🔍</button>';
document.getElementById('tabs').innerHTML = tabHtml;

/* ---------------------------------------------------------
   BUSCADOR
--------------------------------------------------------- */
const SEARCH_INDEX = [];
DAYS.forEach(function(day){ day.stops.forEach(function(stop, i){ SEARCH_INDEX.push({day:day, index:i, stop:stop}); }); });
function renderSearchResults(q){
  const box = document.getElementById('searchresults');
  const query = q.trim().toLowerCase();
  if(!query){ box.innerHTML=''; return; }
  const matches = SEARCH_INDEX.filter(function(item){ return item.stop.n.toLowerCase().includes(query); }).slice(0,20);
  if(!matches.length){ box.innerHTML = '<div class="sres-empty">Sin resultados</div>'; return; }
  box.innerHTML = matches.map(function(item){
    return '<div class="sres" data-day="'+item.day.id+'" data-idx="'+item.index+'">'+
      '<span class="sres-day" style="background:'+DAY_COLORS[item.day.id]+'">D'+item.day.id+'</span>'+
      '<span class="sres-name">'+item.stop.n+'</span>'+
      (item.stop.t ? '<span class="sres-time">'+item.stop.t+'</span>' : '')+
    '</div>';
  }).join('');
  box.querySelectorAll('.sres').forEach(function(el){
    el.addEventListener('click', function(){
      goToSearchResult(Number(el.dataset.day), Number(el.dataset.idx));
    });
  });
}
function goToSearchResult(dayId, idx){
  document.getElementById('searchpanel').style.display='none';
  document.getElementById('searchbtn').classList.remove('active');
  const day = DAYS.find(function(d){ return d.id===dayId; });
  selectTab(dayId);
  focusStop(day, idx, null);
}
function toggleSearch(){
  const panel = document.getElementById('searchpanel');
  const willShow = panel.style.display !== 'flex';
  panel.style.display = willShow ? 'flex' : 'none';
  document.getElementById('searchbtn').classList.toggle('active', willShow);
  if(willShow){
    const input = document.getElementById('searchinput');
    input.value=''; renderSearchResults(''); input.focus();
  }
}
window.toggleSearch = toggleSearch;
document.getElementById('searchinput').addEventListener('input', function(e){ renderSearchResults(e.target.value); });

function selectTab(id){
  document.getElementById('searchpanel').style.display='none';
  document.getElementById('searchbtn').classList.remove('active');
  document.querySelectorAll('.tab').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('tab-'+id).classList.add('active');
  if(id==='general') showGeneral();
  else showDay(DAYS.find(function(d){ return d.id===id; }));
}
window.selectTab = selectTab;

showGeneral();
</script>
